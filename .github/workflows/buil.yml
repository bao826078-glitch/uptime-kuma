name: Build Uptime Kuma Native in Termux ARMv7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-in-termux:
    runs-on: ubuntu-latest

    steps:
      # 1. Giả lập kiến trúc ARM 32-bit (armv7/armhf) cho chip TX3 Mini
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Chạy trực tiếp trong Container Termux Official
      - name: Run Termux Environment & Clone Code
        uses: addnab/docker-run-action@v3
        with:
          image: termux/termux-docker:latest
          options: --platform linux/arm/v7
          run: |
            set -e

            echo "=== 1. Kiểm tra môi trường Termux & CPU ==="
            uname -m

            echo "=== 2. Cập nhật kho gói Termux (pkg) & Cài đặt công cụ ==="
            pkg update -y
            pkg install -y git nodejs-lts python make clang binutils

            echo "=== 3. Dùng GIT kéo toàn bộ mã nguồn Uptime Kuma về ==="
            git clone https://github.com/louislam/uptime-kuma.git /root/uptime-kuma
            cd /root/uptime-kuma

            echo "=== 4. Cài đặt Dependencies & Build Frontend trong Termux ==="
            npm ci
            npm run build

            echo "=== 5. Dọn dẹp devDependencies để giảm dung lượng ==="
            npm prune --production

            echo "=== 6. Nén thành phẩm đã build xong ==="
            tar -czf /tmp/uptime-kuma-termux-armv7.tar.gz \
              --exclude='.git' \
              --exclude='src' \
              --exclude='test' \
              .

      # 3. Trích xuất file nén từ Docker container ra ngoài Runner
      - name: Extract Artifact
        run: |
          CONTAINER_ID=$(docker ps -a --filter "ancestor=termux/termux-docker:latest" --format "{{.ID}}" | head -n 1)
          docker cp $CONTAINER_ID:/tmp/uptime-kuma-termux-armv7.tar.gz ./uptime-kuma-termux-armv7.tar.gz

      # 4. Upload file thành phẩm lên GitHub Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptime-kuma-termux-armv7
          path: uptime-kuma-termux-armv7.tar.gz
          retention-days: 7
