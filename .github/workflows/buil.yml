name: Build Uptime Kuma for Termux (armv8l / arm32)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv8l:
    runs-on: ubuntu-latest

    steps:
      # 1. Tự động kéo (clone) code từ repository về
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cấu hình QEMU giả lập ARM 32-bit (armhf/armv7)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Chạy build trong container Node.js Debian ARM32
      - name: Build inside ARM32 Container
        uses: addnab/docker-run-action@v3
        with:
          image: node:18-bullseye
          options: --platform linux/arm/v7
          run: |
            set -e
            cd $GITHUB_WORKSPACE

            echo "=== 1. Kiểm tra kiến trúc Container ==="
            uname -m

            echo "=== 2. Cập nhật APT index & Cài đặt bộ biên dịch C/C++ ==="
            # Cập nhật index mới nhất để tránh lỗi 404
            apt-get update -y
            apt-get install -y --no-install-recommends --fix-missing \
              build-essential \
              python3 \
              make \
              g++ \
              gcc \
              libc6-dev

            echo "=== 3. Cài đặt Node Modules & Biên dịch Native Modules ==="
            npm ci

            echo "=== 4. Build Frontend (Tạo dist/index.html) ==="
            npm run build

            echo "=== 5. Dọn dẹp devDependencies để tối ưu dung lượng ==="
            npm prune --production

      # 4. Nén toàn bộ sản phẩm hoàn chỉnh
      - name: Compress Build Artifact
        run: |
          tar -czf uptime-kuma-armv8l.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='test' \
            --exclude='docs' \
            .

      # 5. Lưu Artifact để tải về
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptime-kuma-armv8l
          path: uptime-kuma-armv8l.tar.gz
          retention-days: 7
