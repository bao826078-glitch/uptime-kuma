name: Build Uptime Kuma directly in Termux Environment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone source code từ GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Giả lập CPU ARM 32-bit cho TX3 Mini
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Chạy trực tiếp trong Container Termux Official (ARM32)
      - name: Build inside Native Termux Container
        uses: addnab/docker-run-action@v3
        with:
          image: termux/termux-docker:armv7
          run: |
            set -e
            cd $GITHUB_WORKSPACE

            echo "=== 1. Kiểm tra môi trường Termux ==="
            uname -m

            echo "=== 2. Cập nhật Repository & Cài ĐỦ BỘ BIÊN DỊCH Termux (pkg) ==="
            pkg update -y
            pkg install -y \
              nodejs-lts \
              python \
              make \
              clang \
              binutils \
              git

            echo "=== 3. Cài đặt Node Modules & Biên dịch Native Modules ==="
            npm ci

            echo "=== 4. Build Frontend (Tạo dist/index.html) ==="
            npm run build

            echo "=== 5. Dọn dẹp devDependencies để giảm dung lượng ==="
            npm prune --production

      # 4. Nén kết quả đã biên dịch
      - name: Compress Build Artifact
        run: |
          tar -czf uptime-kuma-termux.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='test' \
            --exclude='docs' \
            .

      # 5. Tải file nén lên Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptime-kuma-termux
          path: uptime-kuma-termux.tar.gz
          retention-days: 7
